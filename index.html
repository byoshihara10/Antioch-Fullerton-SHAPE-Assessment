<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>S.H.A.P.E. Assessment</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Antioch Fullerton branding: Helvetica, black and white, Cormorant Garamond for Scripture. Layout: an arched stained-glass window of the 16 gifts anchors the page; each SHAPE letter is a tab; results recolor the window. */
:root{
  --bg:#f5f4f1; --surface:#ffffff; --sunk:#ebeae6; --ink:#141414; --muted:#5e5e5a; --line:#d8d6d0;
  --lead:#141414; --accent:#141414; --accent-ink:#ffffff; --accent-soft:#ebeae6;
  --ruby:#b3263e; --amber:#c47f12; --emerald:#1d8a5a; --cobalt:#2a4fb8; --violet:#6b3fa8; --teal:#14808a;
  --glass-off:#cfcdc7;
  --f-display:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-mono:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-serif:"Cormorant Garamond","Times New Roman",Times,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101010; --surface:#1a1a1a; --sunk:#242424; --ink:#f2f1ee; --muted:#a3a29d; --line:#333331;
  --lead:#000000; --accent:#f2f1ee; --accent-ink:#141414; --accent-soft:#2a2a28;
  --ruby:#e0566c; --amber:#eaa93a; --emerald:#3fbf86; --cobalt:#6d8ef0; --violet:#a27be0; --teal:#3bb6bf;
  --glass-off:#2e2e2c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101010; --surface:#1a1a1a; --sunk:#242424; --ink:#f2f1ee; --muted:#a3a29d; --line:#333331;
  --lead:#000000; --accent:#f2f1ee; --accent-ink:#141414; --accent-soft:#2a2a28;
  --ruby:#e0566c; --amber:#eaa93a; --emerald:#3fbf86; --cobalt:#6d8ef0; --violet:#a27be0; --teal:#3bb6bf;
  --glass-off:#2e2e2c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(2rem,6vw,3rem)}
h2{font-size:clamp(1.5rem,4vw,2rem)}
h3{font-size:1.2rem}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* tabs */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:28px;scrollbar-width:none}
nav.tabs button{flex:0 0 auto;border:1px solid transparent;background:none;border-radius:999px;padding:6px 12px;font-size:.9rem;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px}
nav.tabs button .l{font-family:var(--f-display);font-size:1.05rem;color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink)}
nav.tabs .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
nav.tabs .dot.done{background:var(--emerald)}
nav.tabs .dot.part{background:var(--amber)}

section[data-view]{display:flex;flex-direction:column;gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;font-weight:600;font-size:.95rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:default}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:center}
@media (max-width:680px){.hero{grid-template-columns:1fr}}
.verse{font-family:var(--f-serif);font-size:1.3rem;font-weight:500;line-height:1.45;border-left:2px solid var(--line);padding-left:14px}
.acro{display:grid;gap:8px}
.acro button{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.acro .L{font-family:var(--f-display);font-size:1.8rem;line-height:1;color:var(--accent)}
.acro .t{font-weight:600}
.acro .q{font-size:.88rem;color:var(--muted)}
.acro .st{font-size:.78rem;color:var(--muted);white-space:nowrap}

/* window */
.window{background:var(--lead);padding:8px;border-radius:50% 50% 10px 10px/26% 26% 10px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;aspect-ratio:4/5.2;max-width:100%;position:relative;overflow:hidden}
.window.wide{grid-template-columns:repeat(7,1fr);aspect-ratio:7/5.2;border-radius:50% 50% 10px 10px/30% 30% 10px 10px}
@media (max-width:560px){.window.wide{grid-template-columns:repeat(4,1fr);aspect-ratio:4/6.3;border-radius:50% 50% 10px 10px/22% 22% 10px 10px}}
.pane{position:relative;border-radius:3px;background:var(--glass-off);display:flex;align-items:flex-end;padding:4px;min-width:0;overflow:hidden;transition:filter .3s}
.pane::before{content:"";position:absolute;inset:0;background:var(--c);opacity:var(--o,0);transition:opacity .6s}
.pane::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 30% 20%,rgba(255,255,255,.35),transparent 60%);pointer-events:none}
.pane span{position:relative;z-index:1;font-size:.62rem;line-height:1.1;color:#fff;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.6);overflow-wrap:anywhere}
.pane.top{outline:2px solid #fff;outline-offset:-2px;z-index:2}
.pane .rk{position:absolute;top:3px;right:4px;font-family:var(--f-display);font-size:.9rem}
.window.hide-labels .pane span{display:none}

/* gifts test */
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.q-item{display:grid;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}
.q-item:last-child{border-bottom:0}
.q-item .n{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);margin-right:8px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;max-width:520px}
.scale button{border:1px solid var(--line);background:var(--bg);border-radius:6px;min-height:52px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.scale button b{font-family:var(--f-mono);font-size:.95rem;font-weight:500}
.scale button small{font-size:.66rem;line-height:1.15;color:var(--muted);text-align:center}
.scale button[aria-checked="true"] small{color:inherit}
.scale button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scale-legend{display:flex;justify-content:space-between;max-width:440px;font-size:.72rem;color:var(--muted)}
.pager{display:flex;gap:6px;flex-wrap:wrap}
.pager button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem}
.pager button[aria-current="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.pager button small{font-family:var(--f-mono);color:var(--muted)}

/* checklists */
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.checks.wide{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.chk{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;font-size:.93rem;line-height:1.35}
.chk input{margin-top:3px;accent-color:var(--accent)}
.chk:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.chk small{display:block;color:var(--muted);font-size:.8rem}
.other{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.other input{flex:1 1 200px}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88rem;display:flex;gap:6px;align-items:center}
.pick b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.75rem;font-family:var(--f-mono)}
.pick[aria-pressed="true"]{border-color:var(--accent)}
.empty{font-size:.9rem;color:var(--muted);font-style:italic}

/* personality */
.pers{display:grid;gap:14px}
.pq{display:grid;gap:6px}
.pq .poles{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;font-size:.9rem}
.pq .poles span:last-child{text-align:right}
.seg{display:grid;grid-template-columns:repeat(4,38px);gap:4px}
.seg button{height:34px;border:1px solid var(--line);background:var(--bg);border-radius:6px;font-family:var(--f-mono);padding:0}
.seg button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (max-width:520px){.pq .poles{grid-template-columns:minmax(0,1fr) minmax(0,1fr);row-gap:8px}.pq .poles span:first-child{grid-column:1;grid-row:1;text-align:left}.pq .poles span:last-child{grid-column:2;grid-row:1;text-align:right}.pq .seg{grid-column:1/-1;grid-row:2;justify-self:stretch;grid-template-columns:repeat(4,minmax(0,1fr))}.meter{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.meter .bar{grid-column:1/-1;grid-row:2}.meter>span:last-child{text-align:right}}
.meter{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.85rem}
.meter .bar{height:8px;background:var(--sunk);border-radius:99px;position:relative}
.meter .bar i{position:absolute;top:-4px;width:16px;height:16px;border-radius:50%;background:var(--accent);transform:translateX(-50%);border:2px solid var(--surface)}
.meter .bar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted)}

/* results */
.res-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:640px){.res-grid{grid-template-columns:1fr}}
.toplist{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.toplist li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.toplist li:last-child{border-bottom:0}
.toplist .sw{width:34px;height:34px;border-radius:4px;border:3px solid var(--lead);display:grid;place-items:center;font-family:var(--f-display);color:#fff}
.toplist .ref{font-size:.8rem;color:var(--muted)}
.toplist .sc{font-family:var(--f-mono);font-size:.9rem}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
td .mini{display:inline-block;height:6px;border-radius:3px;background:var(--accent);vertical-align:middle}
.ol{margin:0;padding-left:1.3em}
.kv{display:grid;gap:4px}
.kv .k{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.note{font-size:.85rem;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:18px 20px}
@media (max-width:640px){.about{grid-template-columns:1fr}}
.about .q{font-family:var(--f-display);font-size:1.15rem;line-height:1.35;grid-column:1/-1}
.about h4{margin:0 0 6px;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.about p,.about li{font-size:.93rem}
.about ul,.about ol{margin:0;padding-left:1.2em;display:grid;gap:4px}
.about .vs{font-size:.82rem;color:var(--muted);grid-column:1/-1}
.frame{display:grid;gap:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:22px}
.frame-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px;margin:0;padding:0;list-style:none}
@media (max-width:640px){.frame-list{grid-template-columns:1fr}}
.frame-list li{display:grid;gap:4px}
.frame-list strong{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.frame-list p{font-size:.93rem;color:var(--muted)}
.frame-list .ref{font-size:.8rem;color:var(--muted);font-style:italic}
.catrow{display:grid;grid-template-columns:minmax(0,13rem) minmax(0,1fr) 3rem;gap:10px;align-items:center;font-size:.88rem}
.catrow .mono{text-align:right}
.cbar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.cbar span{display:block;height:100%;border-radius:99px}
@media (max-width:520px){.catrow{grid-template-columns:minmax(0,1fr) 3rem}.catrow .cbar{grid-column:1/-1;grid-row:2}}
.watch{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--sunk);display:grid;gap:4px;font-size:.85rem;line-height:1.45}
.watch strong{color:var(--ink)}
.five-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.five-grid>div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px;font-size:.88rem}
.five-grid>div.on{border-color:var(--accent);background:var(--accent-soft)}
.mbopts{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:620px}
.mbopts button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;text-align:left;font-size:.93rem;line-height:1.35}
.mbopts button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mbbar{display:grid;grid-template-columns:2.6rem minmax(0,1fr) minmax(0,1fr) 2.6rem;gap:6px;align-items:center;font-size:.85rem;color:var(--muted)}
.mbbar .w{color:var(--ink);font-weight:600}
@media (max-width:520px){.mbopts{grid-template-columns:1fr}}
.uio{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.uio>div{background:var(--sunk);border-radius:8px;padding:10px 12px;display:grid;gap:3px;align-content:start}
.uio .k{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.uio p{font-size:.92rem;margin-top:4px}
@media (max-width:640px){.uio{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.9rem;z-index:20}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const FIVE_INTRO="In Ephesians 4:11–13, Paul says Christ gave apostles, prophets, evangelists, shepherds and teachers to equip His people for works of service, so the whole body is built up toward unity and maturity. These five are sometimes called APEST. Christians differ on whether they are offices held by a few leaders or functions any believer can express. Here they're used to show how you may help equip others. Most people lean toward one or two, and a healthy church needs all five.";

Prophet:{looks:"Senses God's heart and timing, calls people back to faithfulness, and notices what's out of alignment.",equips:"Helps others listen to God and respond with obedience.",trip:"Keeps the team prayerful and attentive to what God is doing.",ref:"1 Corinthians 14:3"},

const FIVE=[["Apostle","Apostleship","Pioneers and extends the church's mission into new places."],["Prophet","Prophecy","Helps the church hear and respond to God."],["Evangelist","Evangelism","Reaches people with the good news of Jesus."],["Shepherd","Shepherding","Cares for, protects and builds community among people."],["Teacher","Teaching","Helps people understand and apply God's truth."]];
function fiveScores(){const s=sums();return FIVE.map(([role,g,d])=>{const i=GIFTS.findIndex(x=>x[0]===g);return{role,g,d,t:s[i].t,n:s[i].n}})}
function fiveTop(){const f=fiveScores();if(f.every(x=>!x.n))return[];const m=Math.max(...f.map(x=>x.t));return f.filter(x=>x.t===m)}
const CALLING_DESC="A calling statement is one sentence that sums up how God has shaped you and what you sense He is inviting you to do with it. It brings your gifts, heart and abilities together into a single purpose. It isn't a job title or a final answer. It's a working draft you'll keep refining as you pray, serve and hear from people who know you. \u201cFor we are God's masterpiece... created anew in Christ Jesus, so we can do the good things he planned for us long ago\u201d (Ephesians 2:10, NLT).";
function suggestedCalling(){
  const top=topGifts(2).map(x=>GIFTS[x.i][0]);

  const ab=S.topAbil.slice(0,2).map(x=>abLabel(x).replace(/^./,c=>c.toLowerCase()));
  return `God has gifted me with ${top.length?joinList(top.map(x=>x.toLowerCase())):"___"}, given me a heart for ${heart.length?joinList(heart):"___"}, and wired me with ${ab.length?joinList(ab):"___"}, so that I can ___.`;
}
const callingText=()=>(S.calling||"").trim()||suggestedCalling();
function radarSVG(){
  const f=fiveScores(),W=340,H=300,cx=170,cy=158,R=100,ang=k=>(-90+k*72)*Math.PI/180,pt=(k,r)=>[cx+r*Math.cos(ang(k)),cy+r*Math.sin(ang(k))];
  const ring=v=>FIVE.map((_,k)=>pt(k,R*v/MAXS).map(n=>n.toFixed(1)).join(",")).join(" ");
  const top=new Set(fiveTop().map(x=>x.role));
  const poly=f.map((x,k)=>pt(k,R*Math.max(x.t,0)/MAXS).map(n=>n.toFixed(1)).join(",")).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Radar chart of fivefold ministry scores: ${f.map(x=>x.role+" "+x.t+" of 25").join(", ")}" style="width:100%;max-width:380px;height:auto;display:block;margin:0 auto">
   ${[5,10,15,20,25].map(v=>`<polygon points="${ring(v)}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join("")}
   ${FIVE.map((_,k)=>{const [x,y]=pt(k,R);return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`}).join("")}
   ${[10,20].map(v=>{const [x,y]=pt(0,R*v/MAXS);return `<text x="${x+4}" y="${y+3}" font-size="9" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}</text>`}).join("")}
   <polygon points="${poly}" fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
   ${f.map((x,k)=>{const [px,py]=pt(k,R*x.t/MAXS);return `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${top.has(x.role)?5:3.5}" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>`}).join("")}
   ${f.map((x,k)=>{const [lx,ly]=pt(k,R+26);const anchor=Math.abs(lx-cx)<8?"middle":lx>cx?"start":"end";return `<text x="${lx.toFixed(1)}" y="${(ly-2).toFixed(1)}" text-anchor="${anchor}" font-size="13" font-weight="${top.has(x.role)?700:500}" fill="var(--ink)" font-family="Instrument Sans,system-ui,sans-serif">${x.role}</text><text x="${lx.toFixed(1)}" y="${(ly+12).toFixed(1)}" text-anchor="${anchor}" font-size="10.5" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${x.t}/${MAXS}</text>`}).join("")}
  </svg>`;
}
function heartStatement(){

}

/* scoring */
function sums(){return GIFTS.map(g=>{let t=0,n=0;g[3].forEach(q=>{const v=S.g[q-1];if(v!=null){t+=v;n++}});return{t,n}})}
const answered=()=>S.g.filter(v=>v!=null).length;
function ranks(){
  if(answered()<NQ)return {};
  const t=sums().map(s=>s.t),uniq=[...new Set(t)].sort((a,b)=>b-a),r={};
  let count=0;["A","B","C"].forEach((L,li)=>{if(li>0&&count>=3)return;const v=uniq[li];if(v==null)return;t.forEach((x,i)=>{if(x===v){r[i]=L;count++}})});
  return r;
}
function topGifts(n=3){const s=sums();return s.map((x,i)=>({i,t:x.t})).filter(x=>s[x.i].n>0).sort((a,b)=>b.t-a.t).slice(0,n)}
const total=a=>a.every(v=>v!=null)?a.reduce((x,y)=>x+y,0):null;
function status(v){
  switch(v){
    case "gifts":{const a=answered();return a===NQ?"done":a?"part":""}
    case "heart":return S.topPeople.length&&S.topCauses.length&&S.topHRole.length?"done":(S.people.length||S.causes.length||S.hrole.length)?"part":"";
    case "abilities":return S.topAbil.length?"done":S.abil.length?"part":"";
    case "personality":return mbAnswered()===MB.length?"done":mbAnswered()?"part":"";
    case "experiences":return S.expUse.trim()?"done":(S.edu.length||S.job.length||S.spirit.length||S.serveAge.length||S.serveRole.length||S.life.length)?"part":"";
  }return "";
}

/* window */
function windowHTML(cls=""){

    const o=s[i].n?Math.max(.18,(s[i].t/s[i].n-1)/4):0;
    return `<div class="pane ${answered()===NQ&&top.has(i)?"top":""}" style="--c:${giftHue(i)};--o:${o.toFixed(2)}" title="${esc(g[0])}">${r[i]?`<em class="rk" style="color:#fff">${r[i]}</em>`:""}<span>${esc(g[0].split(" (")[0].split(" /")[0])}</span></div>`}).join("")}</div>`;
}

function pool(key,otherKey){const o=otherKey?S[otherKey].split(",").map(x=>x.trim()).filter(Boolean):[];return S[key].concat(o)}
function picks(key,otherKey,topKey){
  const p=pool(key,otherKey);S[topKey]=S[topKey].filter(x=>p.includes(x));
  if(!p.length)return `<p class="empty">Check items above, then mark your top three here.</p>`;
  return `<div class="picks">${p.map(x=>{const k=S[topKey].indexOf(x);return `<button class="pick" aria-pressed="${k>=0}" data-pick="${topKey}" data-val="${esc(x)}">${k>=0?`<b>${k+1}</b>`:""}${esc(x)}</button>`}).join("")}</div>`;

function refreshPicks(topKey){const map={topPeople:["people","peopleO"],topCauses:["causes","causesO"],topAbil:["abil","abilO"],topHRole:["hrole","hroleO"]};if(!map[topKey]){renderTabs();return}const [k,o]=map[topKey];const el=document.getElementById("pk-"+topKey);if(el){el.innerHTML=picks(k,o,topKey);el.previousElementSibling.querySelector(".note").textContent=S[topKey].length+"/"+(LIMIT[topKey]||3)}renderTabs()}

  const gp=e.target.closest("[data-gp]");

let DL=null;
try{window.claude?.use?.("downloads")?.then(d=>{DL=d}).catch(()=>{})}catch(e){}
function pdfName(){return `SHAPE Report - ${(S.name||"Student").replace(/[^\w\s-]/g,"").trim()||"Student"}.pdf`}
function openPDFFallback(blob,btn,popup){
  const url=URL.createObjectURL(blob),fn=pdfName();
  let opened=false;
  try{if(popup&&!popup.closed){popup.location.href=url;opened=true}}catch(e){}
  if(!opened){try{const w=window.open(url,"_blank");opened=!!w}catch(e){}}
  const card=btn.closest(".card");let box=card&&card.querySelector("#pdfFallback");
  if(card&&!box){box=document.createElement("div");box.id="pdfFallback";box.className="watch";card.appendChild(box)}
  if(box){box.innerHTML=`<strong>${opened?"Your report opened in a new tab.":"Your report is ready."}</strong><span>Open it below, then use your browser's Print or Share button to print or save it.</span><div class="row" style="margin-top:6px"><a class="btn primary" href="${url}" target="_blank" rel="noopener" style="text-decoration:none">Open PDF report</a><a class="btn" href="${url}" download="${fn}" style="text-decoration:none">Save file</a></div>`}
  toast(opened?"Report opened in a new tab":"Report ready below");
}
async function downloadPDF(btn){
  if(!window.jspdf){toast("The PDF tool didn't load. Check your connection and reload.");return}
  btn.disabled=true;
  /* No save permission here: open a blank tab now, while the tap still counts, so popup blockers allow it. */
  let popup=null;if(!DL){try{popup=window.open("","_blank")}catch(e){}}
  let blob=null;
  try{blob=buildPDF();
    if(!DL){openPDFFallback(blob,btn,popup);return}
    await DL.save({filename:pdfName(),data:blob});toast("Report saved");
  }catch(e){
    if(e&&e.code==="declined"){toast("Download cancelled")}
    else if(e&&e.code==="rate_limited"){toast("A save prompt is already open")}
    else if(blob){openPDFFallback(blob,btn,popup)}
    else{try{popup&&popup.close()}catch(_){};toast("Couldn't build the report. Try again.")}
  }
  finally{btn.disabled=false}
}

}
